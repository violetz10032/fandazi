name: Android APK

# 只在 android-app 或 web 资产变化时构建，避免每次提交都跑
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取版本号与提交短哈希
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # 默认输入 "tools platform-tools" 里的 tools 包已从 SDK 仓库移除，会导致该 action 直接失败
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 npm 依赖
        run: npm ci

      - name: 同步 Web 资产到 Android 工程
        run: npx cap sync android

      - name: 构建 debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # activity-alias 方案必须保证合并后的清单里仍有一个可启动入口，否则装上去会没有桌面图标。
      - name: 校验启动入口与双图标资源
        working-directory: android-app/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # 已知行为：aapt / aapt2 的 badging 不会把 activity-alias 报成 launchable-activity，
          # 因此启动入口以合并清单的结构为准，badging 仅作参考输出。
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label:|^application-icon" | head -12 || true
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/manifest.txt', encoding='utf-8').read()
          blocks = {}
          for part in re.split(r'\n\s*E: activity-alias ', text)[1:]:
              if 'MainActivityA' in part:
                  blocks['A'] = part
              elif 'MainActivityB' in part:
                  blocks['B'] = part
          ok = True
          for key, want_enabled, want_icon in (('A', True, 'ic_launcher'), ('B', False, 'ic_launcher_b')):
              b = blocks.get(key)
              if not b:
                  print('缺少 alias ' + key, flush=True)
                  ok = False
                  continue
              if 'android.intent.action.MAIN' not in b or 'android.intent.category.LAUNCHER' not in b:
                  print(key + ' 缺少 MAIN/LAUNCHER', flush=True)
                  ok = False
              m = re.search(r'android:enabled\(0x0101000e\)=[^\n]*?0x(0|ffffffff)', b)
              enabled = bool(m and m.group(1) == 'ffffffff')
              if enabled != want_enabled:
                  print(key + ' enabled 与预期不符', flush=True)
                  ok = False
              if want_icon not in b:
                  print(key + ' 未引用 ' + want_icon, flush=True)
                  ok = False
              if 'targetActivity' not in b:
                  print(key + ' 缺少 targetActivity', flush=True)
                  ok = False
          if not ok:
              sys.exit('清单结构校验失败')
          print('启动入口结构校验通过：A 默认启用、B 默认关闭、两者都带 MAIN/LAUNCHER')
          PY

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: fandazi-debug-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
