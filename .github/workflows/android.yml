name: Android APK

# 只在 android-app 或 web 资产变化时构建，避免每次提交都跑
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/android.yml'

  # PR 到 main 时也构建：合并前就能看到构建结果与 35 项故障检查（34 主用例 + 1 平台专项）
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

# 同一 ref 连续提交时取消旧运行，避免重复占用额度
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取版本号与提交短哈希
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 纯 JVM 校验 FileStore 的原子替换 / 校验 / 旧文件保护 / 并发 / 授权边界，任一失败即中断构建
      - name: FileStore 故障场景测试
        run: |
          mkdir -p /tmp/fs-test
          javac -encoding UTF-8 -d /tmp/fs-test \
            android/app/src/main/java/com/fandazi/app/FileStoreCore.java \
            android/app/src/test/java/com/fandazi/app/FileStoreCoreTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/fs-test com.fandazi.app.FileStoreCoreTest /tmp/fs-store

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # 默认输入 "tools platform-tools" 里的 tools 包已从 SDK 仓库移除，会导致该 action 直接失败
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 npm 依赖
        run: npm ci

      - name: 校验 Web 资产与仓库根一致
        run: |
          cmp -s ../index.html www/index.html || { echo "android-app/www/index.html 与根 index.html 不一致，请先同步后再提交"; exit 1; }

      - name: 同步 Web 资产到 Android 工程
        run: npx cap sync android

      - name: 构建 debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # activity-alias 方案必须保证合并后的清单里仍有一个可启动入口，否则装上去会没有桌面图标。
      - name: 校验启动入口与双图标资源
        working-directory: android-app/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # 已知行为：aapt / aapt2 的 badging 不会把 activity-alias 报成 launchable-activity，
          # 因此启动入口以合并后的清单结构为准，badging 仅作参考输出。
          "$AAPT2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|^application-label:|^application-icon" | head -15 || true
          "$AAPT2" dump resources "$APK" > /tmp/resources.txt
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          NS = 'http://schemas.android.com/apk/res/android'
          def attr(el, name):
              return el.get('{%s}%s' % (NS, name))
          def short(name):
              return (name or '').rsplit('.', 1)[-1]
          def has_launcher(el):
              for f in el.findall('intent-filter'):
                  acts = [attr(a, 'name') for a in f.findall('action')]
                  cats = [attr(c, 'name') for c in f.findall('category')]
                  if 'android.intent.action.MAIN' in acts and 'android.intent.category.LAUNCHER' in cats:
                      return True
              return False

          # 优先用 Gradle 合并后的清单（含 Capacitor 注入项），文件位置随 AGP 版本有差异，按路径找。
          candidates = [p for p in glob.glob('app/build/intermediates/**/AndroidManifest.xml', recursive=True)
                        if 'merged' in p.lower()]
          candidates.sort(key=lambda p: ('merged_manifest' not in p, 'processDebugMainManifest' not in p))
          manifest_path = candidates[0] if candidates else 'app/src/main/AndroidManifest.xml'
          print('校验清单: ' + manifest_path)
          root = ET.parse(manifest_path).getroot()
          app = root.find('application')
          ok = True

          activities = {}
          aliases = {}
          for el in app:
              tag = short(el.tag)
              if tag == 'activity':
                  activities[short(attr(el, 'name'))] = el
              elif tag == 'activity-alias':
                  aliases[short(attr(el, 'name'))] = el

          main = activities.get('MainActivity')
          if main is None:
              print('缺少 MainActivity')
              ok = False
          elif has_launcher(main):
              print('MainActivity 仍直接挂 MAIN/LAUNCHER，桌面会出现重复入口')
              ok = False

          for key, name, want_enabled, want_icon in (
                  ('A', 'MainActivityA', True, '@mipmap/ic_launcher'),
                  ('B', 'MainActivityB', False, '@mipmap/ic_launcher_b')):
              el = aliases.get(name)
              if el is None:
                  print('缺少 activity-alias ' + name)
                  ok = False
                  continue
              enabled = attr(el, 'enabled')
              icon = attr(el, 'icon')
              target = attr(el, 'targetActivity')
              print('%s: enabled=%s icon=%s targetActivity=%s' % (key, enabled, icon, target))
              if (enabled == 'true' if want_enabled else enabled == 'false'):
                  pass
              else:
                  print('%s 的 enabled 与预期不符: %r' % (key, enabled))
                  ok = False
              if icon != want_icon:
                  print('%s 的 icon 与预期不符: %r' % (key, icon))
                  ok = False
              if short(target) != 'MainActivity':
                  print('%s 的 targetActivity 未指向 MainActivity: %r' % (key, target))
                  ok = False
              if not has_launcher(el):
                  print('%s 缺少 MAIN / LAUNCHER' % key)
                  ok = False

          if attr(app, 'icon') != '@mipmap/ic_launcher':
              print('application icon 不是 A 套: %r' % attr(app, 'icon'))
              ok = False

          # B 套各密度位图与 adaptive 配置必须齐全，否则 B alias 在部分设备上会没有图标。
          res = 'app/src/main/res'
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              for suffix in ('', '_round', '_foreground', '_background'):
                  f = '%s/mipmap-%s/ic_launcher_b%s.png' % (res, density, suffix)
                  if not glob.glob(f):
                      print('缺少资源: ' + f)
                      ok = False
          for f in ('%s/mipmap-anydpi-v26/ic_launcher_b.xml' % res,
                    '%s/mipmap-anydpi-v26/ic_launcher_b_round.xml' % res):
              if not glob.glob(f):
                  print('缺少资源: ' + f)
                  ok = False

          resources = open('/tmp/resources.txt', encoding='utf-8').read()
          if 'mipmap/ic_launcher_b' not in resources:
              print('APK 资源表中没有 mipmap/ic_launcher_b')
              ok = False

          if not ok:
              sys.exit('清单结构校验失败')
          print('启动入口结构校验通过：A 默认启用、B 默认关闭、两者都带 MAIN/LAUNCHER 且图标不同，B 套资源齐全')
          PY

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: fandazi-debug-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
