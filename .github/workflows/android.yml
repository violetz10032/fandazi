name: Android APK

# 只在 android-app 或 web 资产变化时构建，避免每次提交都跑
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取版本号与提交短哈希
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # 默认输入 "tools platform-tools" 里的 tools 包已从 SDK 仓库移除，会导致该 action 直接失败
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 npm 依赖
        run: npm ci

      - name: 同步 Web 资产到 Android 工程
        run: npx cap sync android

      - name: 构建 debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: fandazi-debug-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
