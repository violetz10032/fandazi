<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>i吃饭 · 地图内嵌页</title>
<style>
  html,body{height:100%;margin:0;background:#f7f3ec}
  #map{position:absolute;inset:0}
  .fz-dot{
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    color:#fff;font:600 11px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    border:1px solid rgba(255,255,255,.85);box-sizing:border-box;
    box-shadow:0 1px 3px rgba(0,0,0,.18)
  }
  /* 单独用手机浏览器打开本页时，把阶段与真实请求结果显示出来，便于和 APK 内失败对照 */
  .fz-dbg{
    position:absolute;left:8px;right:8px;bottom:8px;margin:0;padding:8px 10px;
    max-height:45%;overflow:auto;z-index:9;
    background:rgba(255,253,246,.96);border:1px solid #f1e4cd;border-radius:8px;
    font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#5a4a34;white-space:pre-wrap;word-break:break-all
  }
</style>
<script>
/* JS API 2.0：安全密钥必须先于 loader 脚本写入，否则会报 INVALID_USER_SCODE */
window._AMapSecurityConfig = { securityJsCode: '78f8691c16bcd9c0ea947e808157ccd2' };
</script>
</head>
<body>
<div id="map"></div>
<pre id="fzDbg" class="fz-dbg hidden"></pre>
<script>
(function(){
  'use strict';
  var KEY = 'a536f4b84111b6d94c846aadcc24e24d';
  var SRC = 'https://webapi.amap.com/maps?v=2.0&key=' + KEY;
  /* 只接受这些宿主源：APK（https://localhost / capacitor://localhost）与本机调试（任意端口） */
  function originAllowed(o){
    o = String(o || '');
    if(o === 'https://localhost' || o === 'capacitor://localhost') return true;
    return /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(o);
  }
  var parentOrigin = '';
  var FZ_PROTO = 4;   /* 与宿主握手协议版本：pong 回传，便于识别缓存里的旧内嵌页；v4 起支持 fz:poi-search */
  var map = null;
  var markers = [];
  var pending = null;
  /* 打点：脚本开始执行 ≈ iframe HTML 载入完成；脚本开始下载 / 脚本载入 / AMap 注册各自记一次 */
  var T0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var tScriptStart = null, tScriptLoaded = null, tAmapReady = null;
  var traceSeq = 0;
  /* 单独打开本页（不在 iframe 里）时才显示诊断面板，方便用户用手机浏览器对照 */
  var standalone = (function(){ try{ return window.parent === window; }catch(e){ return true; } })();
  function dbg(line){
    if(!standalone) return;
    var el = document.getElementById('fzDbg');
    if(!el) return;
    el.classList.remove('hidden');
    el.textContent += (el.textContent ? '\n' : '') + line;
  }

  function now(){
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }
  function elapsedMs(){ return Math.round(now() - T0); }
  function send(msg){
    try{
      /* 首次握手还不知道宿主源，只发就绪/错误这类无业务数据；收到第一条消息后锁定为宿主源 */
      window.parent.postMessage(msg, parentOrigin || '*');
    }catch(e){}
  }
  function tipFor(code){
    if(code === 'INVALID_USER_DOMAIN'){
      return 'INVALID_USER_DOMAIN（10006）：域名校验未通过。本页源应为 violetz10032.github.io；请确认该域名在高德 Key 白名单里。';
    }
    if(code === 'INVALID_USER_SCODE'){
      return 'INVALID_USER_SCODE：securityJsCode 校验未通过，请核对 Key 与安全密钥是否配对。';
    }
    if(code === 'USERKEY_PLAT_NOMATCH'){
      return 'USERKEY_PLAT_NOMATCH：Key 平台类型不匹配，应使用「Web 端（JS API）」Key。';
    }
    if(code === 'INVALID_USER_KEY'){ return 'INVALID_USER_KEY：Key 无效或已过期。'; }
    if(code === 'DAILY_QUERY_OVER_LIMIT'){ return 'DAILY_QUERY_OVER_LIMIT：当日配额已用尽，次日恢复。'; }
    if(code === 'OVER_QUERY_LIMIT'){ return 'OVER_QUERY_LIMIT：调用频率超限，请稍后重试。'; }
    return code ? ('高德返回 ' + code) : '';
  }
  function fail(msg, info){
    var m = { type:'fz:error', message:String(msg || '高德地图加载失败') };
    if(info){ for(var k in info){ if(k !== 'type' && Object.prototype.hasOwnProperty.call(info, k)) m[k] = info[k]; } }
    dbg('ERROR ' + m.message + (info && info.code ? ' [' + info.code + ']' : ''));
    send(m);
  }
  /* 阶段打点回传宿主：只含阶段名与毫秒数，不含坐标或记录内容 */
  function trace(stage, extra){
    try{
      var m = { type:'fz:trace', stage:String(stage), elapsedMs:elapsedMs(), seq:++traceSeq };
      if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra, k)) m[k] = extra[k]; } }
      dbg('trace ' + m.stage + ' @' + m.elapsedMs + ' ms' + (m.url ? ' ' + m.url : ''));
      send(m);
    }catch(e){}
  }
  /* 失败时用同域 fetch 读高德返回的 JSON，拿到真实错误码与 HTTP 状态/耗时（响应带 ACAO:*） */
  function diag(reason){
    var started = now();
    function report(status, ct, ms, code, note){
      var p = { type:'fz:diag', stage:'amap-script', url:SRC,
        httpStatus:(status === null || status === undefined) ? null : Number(status),
        contentType:String(ct || ''), ms:ms, code:String(code || '') };
      dbg('diag HTTP ' + (p.httpStatus === null ? '-' : p.httpStatus) + ' ' + p.contentType +
        ' ' + p.ms + ' ms' + (p.code ? ' code=' + p.code : '') + (note ? ' ' + note : ''));
      send(p);
      return p;
    }
    var timer = setTimeout(function(){
      var p = report(null, '', Math.round(now() - started), '', 'timeout');
      fail(reason + '（诊断请求超时 6 秒）', p);
    }, 6000);
    fetch(SRC, { credentials:'omit', cache:'no-store' })
      .then(function(r){ return r.text().then(function(t){ return { status:r.status, ct:String(r.headers.get('content-type') || ''), t:t }; }); })
      .then(function(o){
        clearTimeout(timer);
        var code = '';
        if(o.t && o.t.charAt(0) === '{'){
          try{ var j = JSON.parse(o.t); code = String(j.info || j.infocode || ''); }catch(e){}
        }
        var p = report(o.status, o.ct, Math.round(now() - started), code, '');
        if(code){ fail(tipFor(code), p); return; }
        if(o.status !== 200){ fail(reason + '：HTTP ' + o.status, p); return; }
        if(/javascript|ecmascript/i.test(o.ct)){ fail(reason + '：脚本可下载但没有注册 AMap，可能被执行策略拦截', p); return; }
        fail(reason + '：返回非脚本内容（' + (o.ct || '未知类型') + '）', p);
      })
      .catch(function(e){
        clearTimeout(timer);
        var p = report(null, '', Math.round(now() - started), '', (e && e.message) || 'network blocked');
        fail(reason + '：请求 webapi.amap.com 失败（' + ((e && e.message) || '网络不可达或被拦截') + '）', p);
      });
  }
  /* 脚本近 1 MB，移动网络下 5–20 秒都属正常；窗口放到 20 秒，期间每 1 秒回传一次进度 */
  var ENSURE_TIMEOUT = 20000;
  function ensure(cb){
    if(window.AMap && typeof window.AMap.Map === 'function'){
      if(tAmapReady === null){
        tAmapReady = elapsedMs();
        trace('amap-ready', { readyMs:tAmapReady });
      }
      cb(null);
      return;
    }
    trace('ensure-start');
    var s = document.createElement('script');
    s.async = true;
    s.src = SRC;
    var settled = false, waited = 0;
    tScriptStart = elapsedMs();
    trace('script-start', { scriptStartMs:tScriptStart, url:SRC });
    var hb = setInterval(function(){
      if(settled) return;
      waited += 1000;
      trace('script-wait', { waitedMs:waited });
    }, 1000);
    var timer = setTimeout(function(){
      if(settled) return;
      settled = true;
      clearTimeout(timer); clearInterval(hb);
      trace('script-timeout', { waitedMs:waited, url:SRC });
      diag('高德脚本加载超时（' + Math.round(ENSURE_TIMEOUT/1000) + ' 秒）');
    }, ENSURE_TIMEOUT);
    s.onload = function(){
      if(settled) return;
      settled = true;
      clearTimeout(timer); clearInterval(hb);
      tScriptLoaded = elapsedMs();
      trace('script-loaded', { scriptStartMs:tScriptStart, scriptLoadedMs:tScriptLoaded, url:SRC });
      if(window.AMap && typeof window.AMap.Map === 'function'){
        tAmapReady = elapsedMs();
        trace('amap-ready', { scriptStartMs:tScriptStart, scriptLoadedMs:tScriptLoaded, readyMs:tAmapReady, url:SRC });
        cb(null);
      }
      else diag('高德脚本已加载但未注册 AMap');
    };
    s.onerror = function(){
      if(settled) return;
      settled = true;
      clearTimeout(timer); clearInterval(hb);
      tScriptLoaded = elapsedMs();
      trace('script-error', { scriptStartMs:tScriptStart, waitedMs:waited, url:SRC });
      diag('高德地图脚本加载失败');
    };
    document.head.appendChild(s);
  }
  function safeColor(c){
    c = String(c || '');
    return /^[#a-zA-Z0-9(),.%\s-]+$/.test(c) ? c : '#e8590c';
  }
  function draw(pts){
    if(!map) return;
    markers.forEach(function(m){ try{ m.setMap(null); }catch(e){} });
    markers = [];
    (pts || []).forEach(function(p){
      if(!p || !isFinite(p.lat) || !isFinite(p.lng)) return;
      var r = Math.max(4, Math.min(18, Number(p.r) || 10));
      var n = Number(p.n) || 1;
      var content = '<div class="fz-dot" style="width:' + (r * 2) + 'px;height:' + (r * 2) + 'px;background:' + safeColor(p.col) + '">' + (n > 1 ? n : '') + '</div>';
      var m = new window.AMap.Marker({
        position:[Number(p.lng), Number(p.lat)], content:content,
        offset:new window.AMap.Pixel(-r, -r), zIndex:200, title:''
      });
      m.on('click', function(){ send({ type:'fz:pick', id:String(p.id) }); });
      markers.push(m);
    });
    try{ map.add(markers); }catch(e){}
  }
  function syncView(){
    if(!map) return;
    var c = map.getCenter();
    if(!c) return;
    send({ type:'fz:view', center:[c.lng, c.lat], zoom:map.getZoom() });
  }
  /* ---- POI 搜索（由宿主表单发起）----
     宿主只发关键词与城市；本页执行 AMap.PlaceSearch 后只回传展示/回填所需字段：
     店名、地址、类型、城市/区域、经纬度。不回传店铺备注、消费金额等任何记录隐私字段。 */
  function compactPoi(p){
    if(!p || !p.location) return null;
    var lng = Number(p.location.lng), lat = Number(p.location.lat);
    if(!isFinite(lng) || !isFinite(lat) || (lng === 0 && lat === 0)) return null;
    if(lng < -180 || lng > 180 || lat < -90 || lat > 90) return null;
    var city = Array.isArray(p.cityname) ? p.cityname.join('') : String(p.cityname || '');
    return {
      id:String(p.id || '').slice(0, 40),
      name:String(p.name || '').slice(0, 80),
      address:String(p.address || '').slice(0, 120),
      adname:String(p.adname || '').slice(0, 40),
      cityname:city.slice(0, 40),
      type:String(p.type || '').slice(0, 80),
      citycode:String(p.citycode || '').slice(0, 20),
      location:{ lng:lng, lat:lat }
    };
  }
  function poiSearch(d){
    var reqId = String(d.reqId || '');
    var keyword = String(d.keyword || '').slice(0, 60);
    var city = String(d.city || '').slice(0, 40);
    function reply(status, extra){
      var m = { type:'fz:poi-result', reqId:reqId, status:String(status || '') };
      if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra, k)) m[k] = extra[k]; } }
      dbg('poi-result ' + m.status + ' · ' + (m.pois ? m.pois.length + ' 条' : '无候选'));
      send(m);
    }
    function run(Cls){
      var ps = null;
      try{
        ps = new Cls({ pageSize:10, pageIndex:1, extensions:'base', city:city, citylimit:!!city });
      }catch(e){
        reply('error', { message:'搜索初始化失败：' + ((e && e.message) || '未知错误') });
        return;
      }
      try{
        ps.search(keyword, function(status, result){
          var extra = {};
          if(result && (result.info || result.infocode)){
            extra.info = String(result.info || '').slice(0, 40);
            extra.infocode = String(result.infocode || '').slice(0, 20);
          }
          if(status === 'complete'){
            var pois = (result && result.poiList && result.poiList.pois) || [];
            extra.pois = pois.map(compactPoi).filter(Boolean).slice(0, 10);
          }
          reply(status, extra);
        });
      }catch(e){
        reply('error', { message:'搜索请求失败：' + ((e && e.message) || '未知错误') });
      }
    }
    if(!keyword){ reply('error', { message:'搜索关键词为空' }); return; }
    ensure(function(err){
      if(err){ reply('error', { message:'高德搜索不可用：' + err }); return; }
      if(window.AMap && typeof window.AMap.PlaceSearch === 'function'){ run(window.AMap.PlaceSearch); return; }
      if(!window.AMap || typeof window.AMap.plugin !== 'function'){
        reply('error', { message:'高德搜索插件不可用（AMap.plugin 缺失）' });
        return;
      }
      /* 插件按需加载；12 秒仍未注册就明确回 timeout，不假装搜到 */
      var settled = false;
      var timer = setTimeout(function(){
        if(settled) return;
        settled = true;
        reply('timeout', { message:'搜索插件加载超时' });
      }, 12000);
      try{
        window.AMap.plugin(['AMap.PlaceSearch'], function(){
          if(settled) return;
          settled = true; clearTimeout(timer);
          if(typeof window.AMap.PlaceSearch !== 'function'){
            reply('error', { message:'搜索插件未注册' }); return;
          }
          run(window.AMap.PlaceSearch);
        });
      }catch(e){
        if(settled) return;
        settled = true; clearTimeout(timer);
        reply('error', { message:'搜索插件初始化失败：' + ((e && e.message) || '未知错误') });
      }
    });
  }
  function init(d){
    if(map) return;
    var center = (d.center && isFinite(d.center[0]) && isFinite(d.center[1])) ? d.center : [116.397428, 39.90923];
    var zoom = Math.max(3, Math.min(19, Number(d.zoom) || 12));
    map = new window.AMap.Map('map', {
      zoom:zoom, center:center, viewMode:'2D', resizeEnable:true, showLabel:true, zooms:[3, 19]
    });
    map.on('complete', function(){ syncView(); });
    map.on('moveend', syncView);
    map.on('zoomend', syncView);
    draw(d.pts);
  }
  window.addEventListener('message', function(e){
    if(!e || e.source !== window.parent) return;
    if(!originAllowed(e.origin)) return;
    parentOrigin = e.origin;
    var d = e.data || {};
    if(d.type === 'fz:ping'){
      /* 宿主探测：回报本页实际来源、Referer 策略，以及 AMap / 地图实例当前是否可用 */
      send({ type:'fz:pong', href:location.href, host:location.host,
        referrer:String(document.referrer || ''), policy:String(document.referrerPolicy || ''),
        amap:!!(window.AMap && typeof window.AMap.Map === 'function'), map:!!map, v:FZ_PROTO });
      return;
    }
    if(d.type === 'fz:init'){
      pending = d;
      ensure(function(err){
        if(err){ fail(err); return; }
        init(pending);
        pending = null;
      });
    }else if(d.type === 'fz:pts' && map){
      draw(d.pts);
    }else if(d.type === 'fz:poi-search'){
      poiSearch(d);
    }else if(d.type === 'fz:camera' && map){
      if(d.center && isFinite(d.center[0]) && isFinite(d.center[1])){
        try{ map.setZoomAndCenter(Math.max(3, Math.min(19, Number(d.zoom) || 12)), d.center); }catch(err){}
      }
    }
  });
  /* 脚本加载完即通知宿主（此时还没有业务数据，可以用 * 作为目标源） */
  dbg('standalone=' + standalone + ' page=' + location.href);
  dbg('script=' + SRC);
  trace('page-start', { href:location.href, v:FZ_PROTO });
  ensure(function(err){
    if(err) return;   /* 失败已由 diag 发送 fz:error */
    if(standalone){
      /* 单独打开时把默认视野画出来，用户能直接看到这张对照页是否正常 */
      init({ center:[116.397428, 39.90923], zoom:10, pts:[] });
      dbg('AMap 注册成功，对照地图已初始化');
    }
    send({ type:'fz:script-ready', v:FZ_PROTO });
  });
})();
</script>
</body>
</html>
